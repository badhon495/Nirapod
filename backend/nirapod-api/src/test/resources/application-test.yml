spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  mail:
    host: localhost
    port: 25
    username: test@example.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  cache:
    type: redis

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

google:
  client:
    id: test

sentry:
  dsn:
  enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: integration-test-secret-min-32-chars-long-enough
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
