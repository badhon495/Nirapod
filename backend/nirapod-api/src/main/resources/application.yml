spring:
  application:
    name: nirapod-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nirapod}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000       # 10 min — reclaim idle connections before Supabase/Neon times out
      max-lifetime: 1800000      # 30 min — rotate before DB-side keepalive limit
      keepalive-time: 60000      # ping idle connections every 60s
      leak-detection-threshold: 5000  # log if connection not returned within 5s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  cache:
    type: redis

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000       # 15 minutes
    refresh-token-expiry-ms: 604800000   # 7 days

  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}

  websocket:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

app:
  admin:
    email: ${ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_DSN_BACKEND:}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: 0.1   # 10% of transactions — free tier: 5k errors/month
  send-default-pii: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.nirapod: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN
    org.hibernate.SQL: WARN
    # Set to DEBUG locally to see slow queries: logging.level.org.hibernate.SQL=DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}  # Supabase/Neon free: 20 pooled, keep headroom
  jpa:
    show-sql: false
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    com.nirapod: WARN
    org.springframework.security: WARN
    org.flywaydb: WARN
