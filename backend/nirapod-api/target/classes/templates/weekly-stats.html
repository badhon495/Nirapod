<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Weekly Stats</title>
  <style>
    body { font-family: sans-serif; color: #1a1a1a; max-width: 600px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    th { text-align: left; padding: 8px 12px; background: #f3f4f6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    .number { font-variant-numeric: tabular-nums; }
    .footer { font-size: 12px; color: #9ca3af; margin-top: 32px; }
  </style>
</head>
<body>
  <h1>Nirapod Weekly Report</h1>
  <p class="subtitle" th:text="${weekLabel}">Week of 2026-01-01</p>

  <table>
    <tr><th colspan="2">Complaints</th></tr>
    <tr><td>Total</td><td class="number" th:text="${stats.totalComplaints}">0</td></tr>
    <tr><td>Unsolved</td><td class="number" th:text="${stats.unsolvedComplaints}">0</td></tr>
    <tr><td>In Progress</td><td class="number" th:text="${stats.inProgressComplaints}">0</td></tr>
    <tr><td>Solved</td><td class="number" th:text="${stats.solvedComplaints}">0</td></tr>
  </table>

  <table>
    <tr><th colspan="2">Users</th></tr>
    <tr><td>Total</td><td class="number" th:text="${stats.totalUsers}">0</td></tr>
    <tr><td>Active</td><td class="number" th:text="${stats.activeUsers}">0</td></tr>
    <tr><td>Pending approval</td><td class="number" th:text="${stats.pendingUsers}">0</td></tr>
    <tr><td>Suspended</td><td class="number" th:text="${stats.suspendedUsers}">0</td></tr>
  </table>

  <table>
    <tr><th>Category</th><th>Complaints</th></tr>
    <tr th:each="entry : ${stats.complaintsByCategory}">
      <td th:text="${entry.key}">POLICE</td>
      <td class="number" th:text="${entry.value}">0</td>
    </tr>
  </table>

  <p class="footer">Generated by Nirapod &mdash; <span th:text="${generatedAt}">2026-01-01T00:00:00Z</span></p>
</body>
</html>
