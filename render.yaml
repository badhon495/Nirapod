services:
  - type: web
    name: nirapod-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: nirapod-db
          property: connectionString
      - key: REDIS_URL
        sync: false   # Set in Render dashboard from Upstash
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: HIKARI_MAX_POOL_SIZE
        value: "5"
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel deployment URL
      # Set these in Render dashboard (secrets):
      # MAIL_USERNAME, MAIL_PASSWORD, GOOGLE_CLIENT_ID,
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
      # SENTRY_DSN_BACKEND, ADMIN_EMAIL

databases:
  - name: nirapod-db
    databaseName: nirapod
    user: nirapod
    plan: free
    region: oregon
