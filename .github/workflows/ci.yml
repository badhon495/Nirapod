name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-lint-test:
    name: Backend — build & unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nirapod_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test with JaCoCo
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/nirapod_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
          GOOGLE_CLIENT_ID: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          FRONTEND_URL: http://localhost:3000
        run: mvn verify -pl nirapod-api -am

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/nirapod-api/target/site/jacoco/

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint-typecheck:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nirapod-web/package-lock.json

      - name: Install dependencies
        working-directory: nirapod-web
        run: npm ci

      - name: Lint (ESLint)
        working-directory: nirapod-web
        run: npm run lint

      - name: Lint (Stylelint)
        working-directory: nirapod-web
        run: npm run lint:css

      - name: Type check
        working-directory: nirapod-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: nirapod-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          AUTH_SECRET: ci-auth-secret
          AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: npm run build

      - name: Bundle size check
        working-directory: nirapod-web
        run: npx bundlesize

  frontend-unit-tests:
    name: Frontend — Vitest unit tests
    runs-on: ubuntu-latest
    needs: frontend-lint-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nirapod-web/package-lock.json

      - name: Install dependencies
        working-directory: nirapod-web
        run: npm ci

      - name: Run Vitest
        working-directory: nirapod-web
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: nirapod-web/coverage/

  # ─── E2E (Playwright) ───────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nirapod
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build Spring Boot (skip tests)
        working-directory: backend
        run: mvn package -pl nirapod-api -am -DskipTests

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/nirapod
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-test-secret-at-least-32-characters-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
          GOOGLE_CLIENT_ID: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          FRONTEND_URL: http://localhost:3000
        run: |
          java -jar nirapod-api/target/nirapod-api-*.jar &
          echo "Waiting for backend..."
          timeout 90 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 3; done'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nirapod-web/package-lock.json

      - name: Install dependencies
        working-directory: nirapod-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: nirapod-web
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: nirapod-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          AUTH_SECRET: e2e-auth-secret
          AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: npm run build

      - name: Start frontend
        working-directory: nirapod-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          AUTH_SECRET: e2e-auth-secret
          AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: |
          npm start &
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: nirapod-web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: nirapod-web/playwright-report/

  # ─── Lighthouse CI ──────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI — performance & a11y
    runs-on: ubuntu-latest
    needs: [frontend-lint-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nirapod-web/package-lock.json

      - name: Install dependencies
        working-directory: nirapod-web
        run: npm ci

      - name: Build
        working-directory: nirapod-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          AUTH_SECRET: lhci-auth-secret
          AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: npm run build

      - name: Start Next.js
        working-directory: nirapod-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          AUTH_SECRET: lhci-auth-secret
          AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: |
          npm start &
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'

      - name: Run Lighthouse CI
        working-directory: nirapod-web
        run: npx lhci autorun --config=lighthouserc.json

      - name: Upload LHCI report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lhci-report
          path: nirapod-web/.lighthouseci/

  # ─── Docker build ───────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./nirapod-web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Render ────────────────────────────────────────────────────────
  deploy:
    name: Deploy — Render.com
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Render backend deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
            -H "Content-Type: application/json" \
            --fail --silent

      - name: Wait for backend health
        run: |
          echo "Waiting for Render deploy (cold start may take ~60s)..."
          timeout 120 bash -c \
            'until curl -sf "${{ vars.BACKEND_HEALTH_URL }}"; do sleep 10; done'

      - name: Smoke test
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ vars.BACKEND_HEALTH_URL }}")
          test "$STATUS" -eq 200
