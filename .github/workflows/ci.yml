name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nirapod_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/nirapod_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
          GOOGLE_CLIENT_ID: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          FRONTEND_URL: http://localhost:3000
        run: mvn verify -pl nirapod-api -am

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/nirapod-api/target/site/jacoco/

  frontend-lint-typecheck:
    name: Frontend — lint & typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nirapod-web/package-lock.json

      - name: Install dependencies
        working-directory: nirapod-web
        run: npm ci

      - name: Lint
        working-directory: nirapod-web
        run: npm run lint

      - name: Type check
        working-directory: nirapod-web
        run: npx tsc --noEmit

      - name: Build
        working-directory: nirapod-web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
          AUTH_SECRET: ci-auth-secret
          AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: npm run build
